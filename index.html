<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bible Reader</title>
  <meta name="theme-color" content="#fcfaf7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />

  <!-- Google Fonts for Elegant Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* --- DESIGN SYSTEM & CSS VARIABLES --- */
    :root {
      --bg-color: #fcfaf7;
      --text-color: #2c2523;
      --heading-font: 'Playfair Display', Georgia, serif;
      --body-font: 'Source Serif 4', Georgia, serif;
      --ui-font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --accent-color: #8c6d3f;
      --accent-gold: #b8860b;
      --red-letter-color: #a33b20;
      --panel-bg: rgba(252, 250, 247, 0.94);
      --border-color: rgba(0, 0, 0, 0.08);
      --verse-num-color: #a89f91;
      --font-size: 1.15rem;
      --line-height: 1.85;
      --text-align: left;
      --bg-image: none;
      --card-bg: rgba(255, 255, 255, 0.8);
      --pill-bg: #f0ebe1;
      --active-pill: #2c2523;
      --active-pill-text: #ffffff;
      --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* --- THEME VARIATIONS --- */
    [data-theme="dark"] {
      --bg-color: #121110;
      --text-color: #e6e2dd;
      --accent-color: #d4af37;
      --accent-gold: #e6c667;
      --red-letter-color: #d96b52;
      --panel-bg: rgba(18, 17, 16, 0.94);
      --border-color: rgba(255, 255, 255, 0.1);
      --verse-num-color: #736e67;
      --card-bg: rgba(28, 26, 25, 0.9);
      --pill-bg: #22201e;
      --active-pill: #e6e2dd;
      --active-pill-text: #121110;
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --accent-color: #2b580c;
      --accent-gold: #3b7a13;
      --red-letter-color: #b32d00;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --border-color: #ebebeb;
      --verse-num-color: #999999;
      --card-bg: #f7f7f7;
      --pill-bg: #f0f0f0;
      --active-pill: #1a1a1a;
      --active-pill-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      font-family: var(--body-font);
      font-size: var(--font-size);
      line-height: var(--line-height);
      text-align: var(--text-align);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* --- MODERN BUTTON SYSTEM --- */
    button, .nav-pill, .nav-btn, .icon-btn, .chip-btn {
      font-family: var(--ui-font);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    button:active, .nav-pill:active, .nav-btn:active, .icon-btn:active, .chip-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    /* --- HEADER & NAVIGATION BAR --- */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(0.6rem + var(--safe-area-top)) 1rem 0.6rem 1rem;
    }

    .nav-pill-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-pill {
      background: var(--pill-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-pill .chevron {
      font-size: 0.65rem;
      opacity: 0.6;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      border: 1px solid var(--border-color);
      background: var(--pill-bg);
      color: var(--text-color);
      font-size: 1rem;
    }

    /* --- MAIN READER CONTENT --- */
    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.25rem calc(5rem + var(--safe-area-bottom)) 1.25rem;
    }

    .book-meta {
      text-align: center;
      margin-bottom: 2rem;
    }

    .translation-tag {
      font-family: var(--ui-font);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-weight: 600;
      display: block;
      margin-bottom: 0.3rem;
    }

    .chapter-header {
      font-family: var(--heading-font);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-color);
      letter-spacing: -0.02em;
    }

    .divider {
      width: 36px;
      height: 2px;
      background: var(--accent-gold);
      margin: 1rem auto 0 auto;
      opacity: 0.6;
      border-radius: 2px;
    }

    .verse {
      margin-bottom: 1rem;
      position: relative;
      border-radius: 8px;
      padding: 0.4rem 0.5rem;
      transition: background 0.2s ease;
      cursor: pointer;
    }

    .verse:active, .verse.selected {
      background: rgba(140, 109, 63, 0.12);
    }

    .verse-num {
      font-family: var(--ui-font);
      font-size: 0.75em;
      font-weight: 700;
      color: var(--verse-num-color);
      margin-right: 0.45rem;
      user-select: none;
      vertical-align: super;
    }

    .red-letter {
      color: var(--red-letter-color);
    }

    /* Drop Cap for Verse 1 */
    .verse[data-verse="1"]::first-letter {
      font-family: var(--heading-font);
      font-size: 1.3em;
      font-weight: 700;
      color: var(--accent-color);
    }

    body.reader-mode .verse-num {
      display: none;
    }
    body.reader-mode .verse.selected .verse-num {
      display: inline-block;
      color: var(--accent-gold);
    }

    /* --- BOTTOM BAR --- */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.25rem calc(0.75rem + var(--safe-area-bottom)) 1.25rem;
      z-index: 10;
    }

    .nav-btn {
      background: var(--pill-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 0.5rem 1rem;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .streak-pill {
      font-family: var(--ui-font);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-color);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.85rem;
      border-radius: 20px;
    }

    /* --- OVERLAY & MODALS --- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Bottom Sheet Modals (Navigation) */
    .modal-sheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      max-height: 80vh;
      background: var(--bg-color);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      z-index: 100;
      padding: 1.5rem 1.25rem calc(1.5rem + var(--safe-area-bottom)) 1.25rem;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
      transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-sheet.open {
      bottom: 0;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sheet-title {
      font-family: var(--ui-font);
      font-size: 1rem;
      font-weight: 700;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 0.6rem;
      overflow-y: auto;
      max-height: 50vh;
      padding: 0.5rem 0;
    }

    .chip-btn {
      background: var(--pill-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 12px;
      padding: 0.65rem 0.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }

    .chip-btn.active {
      background: var(--active-pill);
      color: var(--active-pill-text);
      border-color: var(--active-pill);
    }

    /* --- STATIC-HEADER SETTINGS POP-UP MODAL --- */
    .settings-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: calc(100% - 2rem);
      max-width: 440px;
      max-height: 85vh;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      z-index: 100;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .settings-modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .settings-header-fixed {
      padding: 1.25rem 1.5rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .settings-scroll-body {
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* LIVE PREVIEW CARD */
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.2rem;
      text-align: var(--text-align);
      font-family: var(--body-font);
      font-size: var(--font-size);
      line-height: var(--line-height);
      color: var(--text-color);
      transition: all 0.2s ease;
    }

    .preview-label {
      font-family: var(--ui-font);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 0.4rem;
      display: block;
    }

    .preview-verse-num {
      font-family: var(--ui-font);
      font-size: 0.75em;
      font-weight: 700;
      color: var(--verse-num-color);
      margin-right: 0.4rem;
      vertical-align: super;
    }

    .setting-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .setting-label {
      font-family: var(--ui-font);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--verse-num-color);
    }

    .segmented-control {
      display: flex;
      background: var(--pill-bg);
      padding: 3px;
      border-radius: 12px;
      gap: 2px;
    }

    .segmented-control button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-color);
      padding: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 9px;
    }

    .segmented-control button.active {
      background: var(--card-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* Galleries */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .gallery-chip {
      aspect-ratio: 16/10;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .gallery-chip.active {
      border-color: var(--accent-color);
      transform: scale(0.96);
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--pill-bg);
      padding: 0.6rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .color-picker-row span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .color-picker-row input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
    }

    .toggle-row span {
      font-family: var(--ui-font);
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>
<body data-theme="parchment">

  <!-- TOP NAVIGATION -->
  <header>
    <div class="nav-pill-group">
      <button class="nav-pill" id="btn-book-select">
        <span id="label-book-chapter">John 1</span>
        <span class="chevron">▼</span>
      </button>
      <button class="nav-pill" id="btn-trans-select">
        <span id="label-translation">KJV</span>
        <span class="chevron">▼</span>
      </button>
    </div>
    <button class="icon-btn" id="open-settings" aria-label="Settings">⚙️</button>
  </header>

  <!-- MAIN READER CONTENT -->
  <main id="reader-container">
    <div class="book-meta">
      <span class="translation-tag" id="meta-translation">King James Version</span>
      <h1 class="chapter-header" id="chapter-title">John 1</h1>
      <div class="divider"></div>
    </div>

    <div id="verses-list">
      <!-- Verses will render dynamically here -->
    </div>
  </main>

  <!-- FOOTER NAVIGATION -->
  <footer>
    <button class="nav-btn" id="prev-chapter">← Prev</button>
    <div class="streak-pill">🔥 <span id="streak-count">1</span> Day Streak</div>
    <button class="nav-btn" id="next-chapter">Next →</button>
  </footer>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- MODAL: BOOK & CHAPTER SELECTOR -->
  <div class="modal-sheet" id="nav-modal">
    <div class="sheet-header">
      <div class="sheet-title" id="nav-modal-title">Select Book & Chapter</div>
      <button class="icon-btn" id="close-nav-modal">✕</button>
    </div>
    <div class="sheet-grid" id="nav-grid">
      <!-- Dynamic chips for books or chapters -->
    </div>
  </div>

  <!-- POP-UP SETTINGS MODAL (STATIC HEADER) -->
  <div class="settings-modal" id="settings-modal">
    <div class="settings-header-fixed">
      <div class="sheet-title">Aesthetics & Typography</div>
      <button class="icon-btn" id="close-settings">✕</button>
    </div>

    <div class="settings-scroll-body">
      <!-- LIVE PREVIEW BOX -->
      <div class="preview-card" id="preview-box">
        <span class="preview-label">Live Preview — John 1:1</span>
        <span class="preview-verse-num">1</span>In the beginning was the Word, and the Word was with God, and the Word was God.
      </div>

      <!-- Theme Selection -->
      <div class="setting-section">
        <label class="setting-label">Theme Preset</label>
        <div class="segmented-control" id="theme-control">
          <button data-val="parchment" onclick="setTheme('parchment')">Parchment</button>
          <button data-val="dark" onclick="setTheme('dark')">Dark</button>
          <button data-val="light" onclick="setTheme('light')">Blank</button>
        </div>
      </div>

      <!-- Typography -->
      <div class="setting-section">
        <label class="setting-label">Font Style</label>
        <div class="segmented-control" id="font-control">
          <button data-val="Serif" onclick="setFont('Source Serif 4, Georgia, serif')">Serif</button>
          <button data-val="Sans" onclick="setFont('Inter, system-ui, sans-serif')">Sans</button>
          <button data-val="Editorial" onclick="setFont('Playfair Display, serif')">Editorial</button>
        </div>
      </div>

      <!-- Text Size -->
      <div class="setting-section">
        <label class="setting-label">Text Size</label>
        <div class="segmented-control">
          <button onclick="adjustFontSize(-0.10)">A-</button>
          <button onclick="adjustFontSize(0.10)">A+</button>
        </div>
      </div>

      <!-- Alignment -->
      <div class="setting-section">
        <label class="setting-label">Alignment</label>
        <div class="segmented-control" id="align-control">
          <button data-val="left" onclick="setTextAlign('left')">Left</button>
          <button data-val="center" onclick="setTextAlign('center')">Center</button>
          <button data-val="justify" onclick="setTextAlign('justify')">Justify</button>
        </div>
      </div>

      <!-- Background Gallery -->
      <div class="setting-section">
        <label class="setting-label">Background Gallery</label>
        <div class="gallery-grid" id="bg-gallery">
          <div class="gallery-chip" style="background: #fcfaf7;" onclick="setGalleryBg('none', this)" title="Solid Default"></div>
          <div class="gallery-chip" style="background: linear-gradient(135deg, #f5efe6 0%, #e8decb 100%);" onclick="setGalleryBg('linear-gradient(135deg, #f5efe6 0%, #e8decb 100%)', this)" title="Warm Sand"></div>
          <div class="gallery-chip" style="background: linear-gradient(135deg, #1e1b18 0%, #0d0c0b 100%);" onclick="setGalleryBg('linear-gradient(135deg, #1e1b18 0%, #0d0c0b 100%)', this)" title="Deep Charcoal"></div>
          <div class="gallery-chip" style="background: linear-gradient(135deg, #eaf2ed 0%, #cce0d4 100%);" onclick="setGalleryBg('linear-gradient(135deg, #eaf2ed 0%, #cce0d4 100%)', this)" title="Soft Sage"></div>
        </div>
      </div>

      <!-- Color Customization -->
      <div class="setting-section">
        <label class="setting-label">Color Customization</label>
        <div class="color-picker-row">
          <span>Text Color</span>
          <input type="color" id="text-color-picker" onchange="setTextColor(this.value)" value="#2c2523" />
        </div>
        <div class="color-picker-row" style="margin-top: 0.5rem;">
          <span>Words in Red Color</span>
          <input type="color" id="red-letter-picker" onchange="setRedLetterColor(this.value)" value="#a33b20" />
        </div>
      </div>

      <!-- Reading Modes -->
      <div class="setting-section">
        <label class="setting-label">Reading Mode</label>
        <div class="toggle-row">
          <span>Hide Verse Numbers</span>
          <input type="checkbox" id="chk-reader-mode" onchange="toggleReaderMode()" />
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
